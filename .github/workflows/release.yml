name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: anime-dl-rs-linux-x86_64.tar.gz
            bin_name: anime-dl-rs
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: anime-dl-rs-linux-arm64.tar.gz
            bin_name: anime-dl-rs
            use_cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: anime-dl-rs-windows-x86_64.zip
            bin_name: anime-dl-rs.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: anime-dl-rs-macos-arm64.tar.gz
            bin_name: anime-dl-rs
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: anime-dl-rs-macos-x86_64.tar.gz
            bin_name: anime-dl-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross for cross-compilation
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (Standard)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary (Cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.bin_name }}

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath ..\..\..\${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.asset_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
